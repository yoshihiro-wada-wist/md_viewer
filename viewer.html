<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="mdv-root" id="mdvRoot">
    <div class="mdv-toolbar">
      <span class="mdv-title" id="mdvTitle">Markdown Viewer</span>
      <button id="mdvOpen" title="ファイルを開く">📂 開く</button>
      <span class="mdv-sep"></span>
      <button id="mdvZoomOut" title="縮小 (Ctrl + ホイール下)">−</button>
      <span class="mdv-zoom-level" id="mdvZoom">100%</span>
      <button id="mdvZoomIn" title="拡大 (Ctrl + ホイール上)">＋</button>
      <button id="mdvReset" title="等倍に戻す">100%</button>
      <button id="mdvFit" title="幅に合わせる">幅合わせ</button>
      <span class="mdv-sep"></span>
      <button id="mdvFontDown" title="文字を小さく"><span style="font-size:11px">A</span>−</button>
      <span class="mdv-font-level" id="mdvFont">12px</span>
      <button id="mdvFontUp" title="文字を大きく"><span style="font-size:15px">A</span>＋</button>
      <span class="mdv-sep"></span>
      <button id="mdvPrint" title="印刷 (Ctrl + P)">🖨 印刷</button>
      <span class="mdv-sep"></span>
      <span class="mdv-hint">ドラッグでパン移動 / Ctrl+ホイールで拡大縮小</span>
    </div>
    <div class="mdv-canvas" id="mdvCanvas">
      <div class="mdv-viewport" id="mdvViewport">
        <div class="mdv-page markdown-body" id="mdvPage"></div>
      </div>
      <div class="mdv-empty" id="mdvEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8M8 17h5"/>
        </svg>
        <h2>マークダウンファイルを表示</h2>
        <p>ここに <b>.md</b> ファイルをドラッグ&ドロップ</p>
        <p>または下のボタンから選択してください</p>
        <button class="mdv-open-btn" id="mdvOpenBig">ファイルを選択</button>
      </div>
    </div>
    <input type="file" id="mdvFileInput" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown" style="display:none" multiple>
  </div>
  <script src="markdown.js"></script>
  <script src="mermaid.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
